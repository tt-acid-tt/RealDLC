name: Build RealDLC JAR

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.0"

      - name: Build remapped Fabric mod
        run: gradle --no-daemon clean build

      - name: Verify output JAR
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          jars=(build/libs/RealDLC-*.jar)
          if [ "${#jars[@]}" -eq 0 ]; then
            echo "No RealDLC JAR was produced."
            find build -maxdepth 4 -type f -print || true
            exit 1
          fi
          printf 'JAR ready: %s\n' "${jars[@]}"

      - name: Upload ready-to-install JAR
        uses: actions/upload-artifact@v4
        with:
          name: RealDLC-ready-JAR
          path: build/libs/RealDLC-*.jar
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
